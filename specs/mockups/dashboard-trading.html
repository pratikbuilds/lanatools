<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swaps and perps mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Tokens and d-* surfaces are copied from apps/web/src/styles.css so the
         mockup reads as the live dashboard. */
      @font-face {
        font-family: 'Paper Mono';
        src: url('../../apps/web/src/fonts/paper-mono-variable.woff2') format('woff2');
        font-weight: 100 800;
        font-display: swap;
      }
      :root {
        --mono: 'Paper Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --paper: #f3efe6;
        --ink: #0a1f6e;
        --lime: #d9ff4a;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      .dash {
        --bg: #f3efe6; --panel: #fffdf8; --panel-2: #ebe6da; --line: #d6d0c2; --line-2: #bfb7a4;
        --fg: #0a1f6e; --fg-2: #4a5480; --fg-3: #5f668c; --accent: #0b2fb2; --on-accent: #f3efe6;
        --live: #1d8f55; --up: #1d8f55; --bad: #b8361a; --on-bad: #fffdf8; --scrim: rgb(5 11 43 / 0.4);
        --hatch-c: #ddd6c6; --hdr: #0b2fb2; --hdr-line: transparent; --hdr-dim: #b5c1f0;
        --hatch: repeating-linear-gradient(135deg, var(--hatch-c) 0 1px, transparent 1px 7px);
        color-scheme: light;
        min-height: 100dvh; padding-bottom: 36px; background: var(--bg); color: var(--fg);
        font-family: 'Inter Tight', system-ui, sans-serif; font-size: 14px; line-height: 1.5;
        -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
      }
      .dash[data-theme='dark'] {
        --bg: #08090c; --panel: #0f1115; --panel-2: #171a21; --line: #23272f; --line-2: #343a46;
        --fg: #f3efe6; --fg-2: #aab1c5; --fg-3: #8a90a3; --accent: #f3efe6; --on-accent: #0a1f6e;
        --live: #d9ff4a; --up: #7ad99a; --bad: #ff8a70; --on-bad: #08090c; --scrim: rgb(0 0 0 / 0.55);
        --hatch-c: #1b1e25; --hdr: #0f1115; --hdr-line: #23272f; --hdr-dim: #8d93a5;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      h1, h2, h3, p, dl, dd, ul, ol { margin: 0; padding: 0; }
      ul { list-style: none; }
      button, input, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
      a { color: inherit; }
      [hidden] { display: none !important; }
      .mono { font-family: var(--mono); }

      .d-label { font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
      .d-th { background: var(--hatch), var(--panel-2); }
      .d-card { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
      .d-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--panel); color: var(--fg); font: 600 13px var(--mono); white-space: nowrap; cursor: pointer; text-decoration: none; }
      .d-btn:hover { border-color: var(--fg-3); }
      .d-btn-sm { height: 30px; padding: 0 11px; font-size: 12px; }
      .d-input { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); font-size: 13px; }
      .d-input::placeholder { color: var(--fg-3); }
      .d-chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg-2); font: 500 12px var(--mono); white-space: nowrap; }
      .d-well { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 500 12.5px var(--mono); overflow-wrap: anywhere; }
      .d-h2 { font: 600 15px var(--mono); }
      .d-col { width: 100%; max-width: 1100px; margin-inline: auto; padding-inline: 32px; }

      /* Header bar: destinations only. */
      header { background: var(--hdr); border-bottom: 1px solid var(--hdr-line); color: var(--paper); }
      header .d-col { display: flex; align-items: center; gap: 16px; }
      .wordmark { display: flex; align-items: center; gap: 8px; padding: 16px 0; font: 700 18px var(--mono); letter-spacing: -0.02em; }
      .wordmark small { font-weight: 500; font-size: 18px; color: var(--hdr-dim); }
      nav { display: flex; gap: 6px; align-self: stretch; }
      nav a { position: relative; display: flex; align-items: center; padding: 0 12px; font: 500 13px var(--mono); color: var(--hdr-dim); text-decoration: none; cursor: pointer; }
      nav a[aria-current='page'] { color: var(--paper); font-weight: 600; }
      nav a[aria-current='page']::after { content: ''; position: absolute; inset: auto 12px 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--paper); }
      .pill { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 4px; border: 1.5px solid rgb(181 193 240 / 0.5); border-radius: 999px; font: 500 12.5px var(--mono); }
      .pill i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); color: var(--ink); font-style: normal; font-weight: 700; font-size: 12px; }

      main { padding-top: 28px; padding-bottom: 96px; }
      h1 { font: 600 18px var(--mono); }
      .meta { font: 400 12px var(--mono); color: var(--fg-3); }
      .back { display: inline-flex; gap: 6px; margin-bottom: 14px; font: 500 12px var(--mono); color: var(--fg-3); text-decoration: none; cursor: pointer; }
      .back:hover { color: var(--fg); }

      /* ---------- Transactions ledger (as live) ---------- */
      .band { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; margin-top: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
      .tabs { display: flex; gap: 2px; margin-bottom: -1px; overflow-x: auto; }
      .tabs button { height: 36px; padding: 0 10px; border-bottom: 2px solid transparent; font: 400 13px var(--mono); color: var(--fg-3); white-space: nowrap; cursor: pointer; }
      .tabs button:hover { color: var(--fg); }
      .tabs button[aria-pressed='true'] { color: var(--fg); font-weight: 600; border-bottom-color: var(--fg); }
      .tabs button i { font-style: normal; margin-left: 6px; font-size: 11px; color: var(--fg-3); font-weight: 400; }
      .tools { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }

      .cols { display: grid; grid-template-columns: 5rem minmax(0, 1fr) 11rem 9.5rem 7rem; gap: 0 16px; align-items: center; padding: 0 16px; }
      .thead { min-height: 36px; }
      .day { display: flex; align-items: baseline; gap: 10px; padding: 6px 16px; border-top: 1px solid var(--line); background: var(--bg); }
      .day b { padding-bottom: 1px; border-bottom: 2px solid var(--fg); font: 600 12px var(--mono); }
      .row { width: 100%; min-height: 58px; padding-top: 10px; padding-bottom: 10px; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
      .row:hover { background: var(--bg); }
      .t { font: 400 12px var(--mono); color: var(--fg-3); }
      .what { min-width: 0; }
      .what b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 13.5px var(--mono); }
      .what span.sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--fg-3); }
      .what span.sub.bad { color: var(--bad); }
      .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--fg-3); }
      .src b { color: var(--fg); font-weight: 600; }
      .amt { text-align: right; white-space: nowrap; font: 600 15px var(--mono); letter-spacing: -0.02em; }
      .amt u { margin-left: 4px; text-decoration: none; font-size: 11.5px; font-weight: 500; letter-spacing: 0; opacity: 0.7; }
      .amt .in { display: inline-block; padding: 1px 8px; border-radius: 5px; background: var(--lime); color: var(--ink); }
      .amt .got { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--up); }
      .amt .got u { opacity: 0.8; }
      .amt .note { display: block; margin-top: 1px; font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--fg-3); }
      .amt .quiet { color: var(--fg); }
      .row.gone .amt { color: var(--fg-3); font-weight: 400; text-decoration: line-through; }
      .row.gone .amt .got { display: none; }
      .sig a { font: 400 12px var(--mono); color: var(--fg-3); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
      .sig a:hover { color: var(--accent); }
      .st { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 4px; vertical-align: 2px; font: 600 11px var(--mono); }
      .st-pending { border: 1px solid var(--accent); color: var(--accent); }
      .st-failed { background: var(--bad); color: var(--on-bad); }
      .side { font-weight: 700; }
      .side.long { color: var(--up); }
      .side.short { color: var(--bad); }
      .new { outline: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -3px; }

      /* ---------- Drawer ---------- */
      .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
      .drawer { position: fixed; z-index: 21; inset: 0 0 0 auto; width: min(28rem, 100vw); overflow-y: auto; padding: 20px 28px 40px; border-left: 1px solid var(--line); background: var(--panel); animation: slide 220ms var(--ease-out); }
      @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
      .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin: 0 -28px 24px; padding: 0 28px 20px; border-bottom: 1px dashed var(--line-2); }
      .dh p { font: 400 11.5px var(--mono); color: var(--fg-3); }
      .dh h2 { margin-top: 4px; font: 600 17px var(--mono); letter-spacing: -0.01em; }
      .big { margin: 12px 0 4px; font: 600 2.6rem/1 var(--mono); letter-spacing: -0.05em; }
      .big u { text-decoration: none; font-size: 1.4rem; letter-spacing: -0.02em; }
      .under { font: 500 13px var(--mono); color: var(--fg-2); }
      .status-note { margin-top: 6px; font-size: 12px; color: var(--fg-3); }
      .facts { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); margin-top: 20px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
      .facts dt { padding: 11px 14px; border-top: 1px solid var(--line); background: var(--hatch), var(--panel-2); font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
      .facts dd { padding: 10px 14px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
      .facts > :nth-child(1), .facts > :nth-child(2) { border-top: 0; }
      .section-l { margin-top: 24px; margin-bottom: 8px; }

      /* Swap: what left, what came back. */
      .flow { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .leg { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; }
      .leg + .leg { border-top: 1px solid var(--line); }
      .leg .lbl { font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
      .leg .val { font: 600 22px/1.2 var(--mono); letter-spacing: -0.03em; }
      .leg .val u { text-decoration: none; font-size: 14px; }
      .leg .usd { font: 400 12px var(--mono); color: var(--fg-3); text-align: right; }
      .leg.out .val { color: var(--fg); }
      .leg.in { background: color-mix(in srgb, var(--lime) 22%, var(--panel)); }
      .dash[data-theme='dark'] .leg.in { background: color-mix(in srgb, var(--lime) 8%, var(--panel)); }
      .leg.in.est { background: none; }
      .tok { width: 34px; height: 34px; border-radius: 50%; }
      .swapmark { position: relative; height: 0; }
      .swapmark span { position: absolute; left: 16px; top: -12px; display: grid; place-items: center; width: 24px; height: 24px; margin-left: 5px; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); font: 600 12px var(--mono); color: var(--fg-3); }

      /* Perp: an order ticket. */
      .ticket { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .ticket-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
      .ticket-head b { font: 600 13px var(--mono); }
      .ticket-grid { display: grid; grid-template-columns: 1fr 1fr; }
      .ticket-grid div { padding: 10px 14px; border-top: 1px solid var(--line); }
      .ticket-grid div:nth-child(odd) { border-right: 1px solid var(--line); }
      .ticket-grid div:nth-child(-n + 2) { border-top: 0; }
      .ticket-grid dt { font: 500 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
      .ticket-grid dd { margin-top: 2px; font: 600 13.5px var(--mono); }
      .ticket-grid dd small { font-weight: 400; color: var(--fg-3); font-size: 11.5px; }
      .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font: 600 11.5px var(--mono); }
      .tag.long { background: color-mix(in srgb, var(--up) 14%, transparent); color: var(--up); }
      .tag.short { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
      .tag.plain { border: 1px solid var(--line); color: var(--fg-2); }
      .notice { margin-top: 12px; padding: 10px 12px; border-left: 2px solid var(--line-2); font-size: 12.5px; color: var(--fg-2); }
      .poscard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; margin-top: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-decoration: none; cursor: pointer; }
      .poscard:hover { border-color: var(--fg-3); }
      .poscard b { font: 600 13.5px var(--mono); }
      .poscard span { font: 400 12px var(--mono); color: var(--fg-3); }
      .poscard em { grid-row: span 2; font: 600 12px var(--mono); font-style: normal; color: var(--fg); }

      .up { color: var(--up); }
      .down { color: var(--bad); }

      /* ---------- Phoenix account ---------- */
      .acct-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .addr-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
      .addr-bar .d-input { width: 22rem; font-family: var(--mono); font-size: 12.5px; }
      .summary { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(4, minmax(0, 1fr)); margin-top: 22px; }
      .summary > div { padding: 18px 20px; border-left: 1px solid var(--line); }
      .summary > div:first-child { border-left: 0; }
      .summary .value { margin-top: 6px; font: 600 15px var(--mono); letter-spacing: -0.02em; }
      .summary .hero { font-size: 2.1rem; line-height: 1; letter-spacing: -0.05em; margin-top: 10px; }
      .summary .sub2 { margin-top: 4px; font: 400 11.5px var(--mono); color: var(--fg-3); }
      .sec { margin-top: 32px; }
      .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 12px; }
      .sec-head .meta { margin-left: auto; }
      .tbl { width: 100%; border-collapse: collapse; }
      .tbl th { height: 36px; padding: 0 14px; text-align: left; font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); white-space: nowrap; }
      .tbl td { height: 54px; padding: 0 14px; border-top: 1px solid var(--line); font: 500 13px var(--mono); white-space: nowrap; }
      .tbl tbody tr { cursor: pointer; }
      .tbl tbody tr:hover td { background: var(--bg); }
      .tbl .r { text-align: right; }
      .tbl .mk b { font-weight: 600; }
      .tbl .mk small { display: block; font-size: 11px; color: var(--fg-3); font-weight: 400; }
      .tbl .pnl { font-weight: 600; }
      .tbl .pnl small { display: block; font-size: 11px; font-weight: 400; }
      .tbl .by { font-family: 'Inter Tight', system-ui, sans-serif; font-size: 12.5px; color: var(--fg-3); }
      .tbl .by b { color: var(--fg); font-weight: 600; }
      .tbl td.sig a { font-weight: 400; }
      .empty-row { padding: 22px 16px; text-align: center; font: 400 12.5px var(--mono); color: var(--fg-3); }
      .acct-empty { margin-top: 24px; padding: 40px 20px; border: 1px dashed var(--line-2); border-radius: 10px; text-align: center; }
      .acct-empty p { max-width: 34rem; margin: 8px auto 0; font-size: 13px; color: var(--fg-3); }
      .scroll-x { overflow-x: auto; }
      .only-xs { display: none !important; }


      /* Account strip: four numbers, no boxes. */
      .strip { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 40px; margin-top: 22px; }
      .strip .sv { margin-top: 4px; font: 600 15px var(--mono); letter-spacing: -0.02em; }
      .strip .sv.hero { font-size: 2rem; line-height: 1; letter-spacing: -0.05em; }

      /* The trade card: chart on the left, the position on the right. */
      .trade { margin-top: 20px; }
      .trade-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
      .mk-tabs { margin-bottom: -1px; }
      .mk-tabs button { height: 44px; }
      .mk-tabs .side { margin-left: 6px; font-size: 11.5px; font-weight: 600; }
      .d-seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
      .d-seg button { padding: 3px 10px; border-radius: 6px; color: var(--fg-3); font: 500 12px var(--mono); cursor: pointer; }
      .d-seg button[aria-pressed='true'] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }
      .trade-body { display: grid; grid-template-columns: minmax(0, 1fr) 17rem; }
      .chart-wrap { position: relative; min-width: 0; display: flex; flex-direction: column; }
      .ll { height: 360px; }
      .ohlc { display: flex; gap: 14px; padding: 10px 16px 0; font: 500 11.5px var(--mono); color: var(--fg-3); min-height: 28px; }
      .ohlc b { font-weight: 600; }
      .chart-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; }
      .chart-tools .d-btn[aria-pressed='true'] { border-color: var(--bad); color: var(--bad); }
      .key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: auto; padding: 10px 16px; border-top: 1px solid var(--line); font: 500 12px var(--mono); color: var(--fg-2); }
      .key i { display: inline-block; width: 14px; height: 0; margin-right: 7px; vertical-align: middle; border-top: 1.5px dashed var(--fg-2); }
      .key .k-liq { color: var(--fg); }
      .key .k-liq i { border-top: 2px solid var(--bad); }
      .key .k-liq small { color: var(--bad); font-size: 11px; }
      .key .k-order { border-top-style: dotted !important; }
      .key-src { margin-left: auto; color: var(--fg-3); font-size: 11px; }
      .pos { padding: 20px; border-left: 1px solid var(--line); }
      .pos-size { margin-top: 8px; font: 600 18px var(--mono); letter-spacing: -0.02em; }
      .pos-pnl { margin-top: 2px; font: 600 26px/1.15 var(--mono); letter-spacing: -0.04em; }
      .pos-pnl small { font-size: 13px; letter-spacing: 0; }
      .pos-facts { display: grid; grid-template-columns: auto 1fr; margin-top: 16px; border-top: 1px solid var(--line); }
      .pos-facts dt, .pos-facts dd { padding: 9px 0; border-bottom: 1px solid var(--line); }
      .pos-facts dt { font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
      .pos-facts dd { text-align: right; font: 600 13px var(--mono); }
      .pos-facts dd small { display: block; font-size: 11px; font-weight: 400; color: var(--fg-3); }
      .pos-facts .liq-t { color: var(--bad); }

      .chart { display: block; overflow: visible; }
      .chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
      .chart .price { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
      .chart .fade-a { stop-color: var(--accent); stop-opacity: 0.12; }
      .chart .fade-b { stop-color: var(--accent); stop-opacity: 0; }
      .chart .danger-line { stroke: var(--bad); stroke-width: 1.2; opacity: 0.35; }
      .chart .axis { font: 400 11px var(--mono); fill: var(--fg-3); }
      .chart .ref { stroke-width: 1.25; }
      .chart .ref.entry { stroke: var(--fg-2); stroke-dasharray: 5 4; }
      .chart .ref.mark { stroke: var(--accent); stroke-opacity: 0.35; }
      .chart .ref.liq { stroke: var(--bad); }
      .chart .ref.liq.pinned { stroke-opacity: 0; }
      .chart .ref.order { stroke: var(--fg-3); stroke-dasharray: 1.5 3; }
      .chart .rlab rect { fill: var(--panel); stroke: var(--line-2); }
      .chart .rlab text { font: 600 11.5px var(--mono); fill: var(--fg); }
      .chart .rlab .rtag { font-size: 10px; font-weight: 500; fill: var(--fg-3); }
      .chart .rlab.mark rect { fill: var(--accent); stroke: var(--accent); }
      .chart .rlab.mark text, .chart .rlab.mark .rtag { fill: var(--on-accent); }
      .chart .rlab.liq rect { stroke: var(--bad); }
      .chart .rlab.liq .rtag { fill: var(--bad); font-weight: 700; }
      .chart .now { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
      .chart .cross { stroke: var(--fg-3); stroke-dasharray: 2 3; }
      .chart .hdot { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
      .chart .hit { cursor: crosshair; }
      .tip { position: absolute; z-index: 2; width: 190px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); box-shadow: 0 8px 20px rgb(10 31 110 / 0.12); pointer-events: none; font: 500 12.5px var(--mono); }

      .buf { margin-top: 16px; }
      .buf .d-label b { margin-left: 4px; color: var(--fg); font-weight: 600; }
      .buf-track { position: relative; height: 10px; margin-top: 10px; border-radius: 5px; background: var(--panel-2); }
      .buf-room { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: color-mix(in srgb, var(--accent) 22%, transparent); }
      .buf-track i { position: absolute; top: -4px; width: 2px; height: 18px; margin-left: -1px; border-radius: 1px; }
      .buf-liq { background: var(--bad); }
      .buf-entry { background: var(--fg-3); }
      .buf-mark { background: var(--accent); width: 10px !important; height: 10px !important; top: 0 !important; margin-left: -5px !important; border-radius: 50% !important; box-shadow: 0 0 0 2px var(--panel); }
      .buf-ends { display: flex; justify-content: space-between; margin-top: 6px; font: 500 11px var(--mono); color: var(--fg-3); }
      .tbl tbody tr.on td { background: var(--bg); }
      .tbl tbody tr.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

      /* ---------- status bar ---------- */
      .status-bar { position: fixed; inset: auto 0 0; z-index: 5; display: flex; height: 36px; border-top: 1px solid var(--line); background: var(--bg); color: var(--fg-2); font: 500 12px var(--mono); }
      .status-bar > div { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-right: 1px solid var(--line); white-space: nowrap; }
      .status-bar > div:last-child { margin-left: auto; border-right: 0; border-left: 1px solid var(--line); }
      .status-bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }

      /* Mockup controls, not part of the design. */
      .mock { position: fixed; left: 50%; bottom: 48px; z-index: 30; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; border: 1.5px dashed var(--fg-3); border-radius: 22px; background: var(--panel); font: 500 12px var(--mono); color: var(--fg-3); white-space: nowrap; box-shadow: 0 8px 24px rgb(0 0 0 / 0.12); }
      .mock button { height: 28px; padding: 0 12px; border-radius: 14px; cursor: pointer; }
      .mock button[aria-pressed='true'] { background: var(--fg); color: var(--bg); }
      .mock span { padding: 0 8px; }

      @media (max-width: 1023px) {
        .d-col { padding-inline: 16px; }
        nav a { padding: 0 7px; font-size: 12px; }
        .pill span { display: none; }
        .thead { display: none; }
        .cols { grid-template-columns: 4.4rem minmax(0, 1fr) auto; gap: 0 12px; padding: 0 14px; }
        .row .src, .row .sig { display: none; }
        .what b { white-space: normal; }
        .summary { grid-template-columns: 1fr 1fr; }
        .summary > div:first-child { grid-column: span 2; border-bottom: 1px solid var(--line); }
        .summary > div:nth-child(2), .summary > div:nth-child(4) { border-left: 0; }
        .summary > div:nth-child(n + 4) { border-top: 1px solid var(--line); }
        .tbl .hide-sm { display: none; }
        .addr-bar .d-input { width: 100%; }
        .trade-body { grid-template-columns: 1fr; }
        .pos { border-left: 0; border-top: 1px solid var(--line); }
        .acct-head .d-input { width: 100% !important; }
        .strip { gap: 12px 28px; }
        .wordmark small { display: none; }
      }
      @media (max-width: 560px) {
        nav { display: none; }
        .tbl .hide-xs { display: none; }
        .tbl .only-xs { display: block !important; }
        .tbl th, .tbl td { padding: 0 10px; }
        .addr-bar .mono { overflow-wrap: anywhere; min-width: 0; }
        .ticket-grid { grid-template-columns: 1fr; }
        .ticket-grid div:nth-child(odd) { border-right: 0; }
        .ticket-grid div:nth-child(2) { border-top: 1px solid var(--line); }
        .drawer { padding-inline: 20px; }
        .dh { margin-inline: -20px; padding-inline: 20px; }
      }
      @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
    </style>
  </head>
  <body>
    <div class="dash" id="dash" data-theme="light">
      <header>
        <div class="d-col">
          <span class="wordmark">
            <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M16 56h-4q-4 0-4-4V15q0-7 7-7h23l19 12.5V29L37 16H19.5q-3.5 0-3.5 3.5Z" fill="currentColor" />
              <path d="M23 26l8 7-8 7" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
              <rect x="35" y="41" width="15" height="5" rx="2.5" fill="#d9ff4a" />
            </svg>
            <span>lanatools<small>.sh</small></span>
          </span>
          <nav aria-label="Main">
            <a>Wallet</a><a>Payments</a><a>Activity</a><a id="nav-tx" aria-current="page">Transactions</a><a>Settings</a>
          </nav>
          <span class="pill"><i>P</i><span>pratik@example.com</span></span>
        </div>
      </header>

      <main class="d-col" id="main"></main>

      <footer class="status-bar">
        <div><i></i>Agent payments on</div>
        <div>mcp.lanatools.sh · 2 clients connected</div>
        <div id="net">Solana devnet</div>
      </footer>

      <div class="mock" role="group" aria-label="Mockup controls">
        <span>Mockup</span>
        <button data-view="tx" aria-pressed="true">Transactions</button>
        <button data-view="perps" aria-pressed="false">Phoenix account</button>
        <button id="m-empty" aria-pressed="false">No account</button>
        <button id="m-theme" aria-pressed="false">Dark</button>
      </div>

      <div id="overlay" hidden>
        <div class="scrim" id="scrim"></div>
        <aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
      </div>
    </div>

    <!-- Mockup only: the app would add lightweight-charts (Apache-2.0) as a dependency. -->
    <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <script>
      const $ = (id) => document.getElementById(id)
      const WALLET = 'G7fu2vBDEZ9SYM4agJPshffJQUmyg6UCEEUnxuYRAMuq'
      const LOCAL = '7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU'
      const SIG = '4vJ9JU1bJJE96FWSJKvHsmmFADCg4gpZQff4P3bkLKi8nXv2Tq1ZsVhUuYc6mRkQ3d5yW7oE2pBtGxHnLfAaJe9'
      const SIG2 = '2Qm8xZbYH6kPq1sTd3vWn7yRtL9cFe4gJa5hUo6iKpVbNrXwS8zDfA1eC3tG7yHj9kLmQ2wErT5uYi8oPaSdFg'
      const SIG3 = '3Rn7Lx9kPq2wErT5uYi8oPaSdFgHj1kLmQ2wZbYH6kPq1sTd3vWn7yRtL9cFe4gJa5hUo6iKpVbNrXwS8zaJe9'
      const short = (a) => `${a.slice(0, 4)}…${a.slice(-4)}`
      const usd = (n, signed = false) =>
        `${signed ? (n > 0 ? '+' : n < 0 ? '−' : '') : n < 0 ? '−' : ''}$${Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: Math.abs(n) > 0 && Math.abs(n) < 0.01 ? 4 : 2 })}`
      const unit = (v) => v.replace(/ (\S+)$/, '<u>$1</u>')
      const sig = (s) => (s ? `<a href="#" onclick="event.stopPropagation()">${short(s)} ↗</a>` : '')
      const state = { view: 'tx', empty: false, address: null }

      // Token marks for the drawer only; rows stay free of icons.
      const TOKEN = {
        SOL: `<svg class="tok" viewBox="0 0 34 34"><defs><linearGradient id="sg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9945ff"/><stop offset="1" stop-color="#14f195"/></linearGradient></defs><circle cx="17" cy="17" r="17" fill="#0b0b10"/><path d="M10 21.5h12l2-2H12zM10 14.5h12l2-2H12zM12 18h12l-2-2H10z" fill="url(#sg)"/></svg>`,
        USDC: `<svg class="tok" viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#2775ca"/><text x="17" y="22" text-anchor="middle" font-family="Inter Tight,sans-serif" font-weight="700" font-size="13" fill="#fff">$</text><circle cx="17" cy="17" r="10.5" fill="none" stroke="#fff" stroke-width="1.6"/></svg>`,
      }

      // ---------------------------------------------------------------------
      // Transactions. Each agent row carries a typed `trade` summary from the
      // API (swap or perp), so nothing is read from label strings.
      const CLIENT = { codex: 'Codex', claude: 'Claude Code' }
      const DELIVERY = { embedded: 'Embedded', link: 'Link', local: 'Local' }
      const rows = [
        { id: 'swap1', day: 'Today', t: '2:31 PM', client: 'codex', delivery: 'embedded', status: 'confirmed', account: WALLET, sig: SIG, slot: '454798245',
          trade: { kind: 'swap', pay: { amount: '1', symbol: 'USDC', usd: 1.0 }, get: { amount: '0.00913', symbol: 'SOL', usd: 1.0 }, actual: true, min: '0.00908 SOL', slippage: '0.5%', rate: '1 SOL = 109.52 USDC', venue: 'Jupiter' } },
        { id: 'buy1', day: 'Today', t: '2:05 PM', client: 'codex', delivery: 'embedded', status: 'confirmed', account: WALLET, sig: SIG2, slot: '454797410',
          trade: { kind: 'order', market: 'SOL-PERP', base: 'SOL', side: 'buy', type: 'market', size: '0.1', limit: 110.15, fill: 109.6, notional: 10.96, fee: 0.0055, reduceOnly: false, slippage: '0.5%' } },
        { id: 'lim1', day: 'Today', t: '1:40 PM', client: 'claude', delivery: 'link', status: 'open', account: null,
          trade: { kind: 'order', market: 'ETH-PERP', base: 'ETH', side: 'sell', type: 'limit', size: '0.5', price: 2590, notional: 1295, reduceOnly: false, postOnly: true, best: 2504.2 },
          reviewUrl: 'https://lanatools.sh/t/8f3a…c21e', expires: 'Today at 1:55 PM' },
        { id: 'close1', day: 'Today', t: '12:10 PM', client: 'codex', delivery: 'local', status: 'confirmed', account: LOCAL, sig: SIG3, slot: '454790011',
          trade: { kind: 'close', market: 'SOL-PERP', base: 'SOL', side: 'sell', type: 'market', size: '1.5', closing: 'long 1.5', fill: 109.48, notional: 164.22, fee: 0.0821, realized: 4.05 } },
        { id: 'dep1', day: 'Today', t: '11:52 AM', client: 'codex', delivery: 'embedded', status: 'confirmed', account: WALLET, sig: SIG, slot: '454789002',
          trade: { kind: 'deposit', amount: '250' } },
        { id: 'act1', day: 'Today', t: '11:50 AM', client: 'codex', delivery: 'embedded', status: 'confirmed', account: WALLET, sig: SIG2, slot: '454788950',
          trade: { kind: 'activate' } },
        { id: 'swap2', day: 'Today', t: '9:12 AM', client: 'codex', delivery: 'embedded', status: 'failed', account: WALLET, sig: SIG3, reason: 'chain_failed',
          trade: { kind: 'swap', pay: { amount: '0.1', symbol: 'SOL', usd: 10.95 }, get: { amount: '10.95', symbol: 'USDC', usd: 10.95 }, actual: false, min: '10.89 USDC', slippage: '0.5%', rate: '1 SOL = 109.52 USDC', venue: 'Jupiter' } },
        { id: 'cancel1', day: 'Yesterday', t: '6:05 PM', client: 'claude', delivery: 'embedded', status: 'confirmed', account: WALLET, sig: SIG, slot: '454601877',
          trade: { kind: 'cancel', market: 'SOL-PERP', count: 2 } },
        { id: 'wd1', day: 'Yesterday', t: '4:45 PM', client: 'codex', delivery: 'embedded', status: 'confirmed', account: WALLET, sig: SIG2, slot: '454600120',
          trade: { kind: 'withdraw', amount: '40' } },
        { id: 'deposit-usdc', day: 'Yesterday', t: '10:14 AM', kind: 'deposit', status: 'confirmed', in: '25 USDC', from: LOCAL, sig: SIG3, slot: '454412390' },
      ]
      const group = (r) => (['open', 'preparing', 'ready', 'submitting', 'unknown'].includes(r.status) ? 'pending' : r.status)
      const gone = (r) => group(r) === 'failed' || group(r) === 'expired'
      const sideWord = (s) => (s === 'buy' ? 'Buy' : 'Sell')

      function title(r) {
        const t = r.trade
        if (!t) return 'Deposit USDC'
        if (t.kind === 'swap') return `Swap ${t.pay.symbol} → ${t.get.symbol}`
        if (t.kind === 'order') return `${sideWord(t.side)} ${t.size} ${t.market}`
        if (t.kind === 'close') return `Close ${t.closing} ${t.market}`
        if (t.kind === 'deposit') return 'Deposit to Phoenix'
        if (t.kind === 'withdraw') return 'Withdraw from Phoenix'
        if (t.kind === 'cancel') return `Cancel ${t.count} ${t.market} orders`
        if (t.kind === 'activate') return 'Activate Phoenix account'
      }
      // The second line: where, and the one number that matters.
      function sub(r) {
        const t = r.trade
        if (group(r) === 'failed') return `<span class="sub bad">Rejected by the chain. Nothing moved.</span>`
        if (!t) return `<span class="sub">From ${short(r.from)}</span>`
        const pending = group(r) === 'pending'
        if (t.kind === 'swap') return `<span class="sub">Jupiter · ${t.rate}</span>`
        if (t.kind === 'order')
          return `<span class="sub">Phoenix · ${t.type === 'market' ? (t.fill && !pending ? `Market, filled at ${usd(t.fill)}` : `Market, at most ${usd(t.limit)}`) : `Limit at ${usd(t.price)}${t.postOnly ? ', post only' : ''}`}</span>`
        if (t.kind === 'close') return `<span class="sub">Phoenix · Filled at ${usd(t.fill)}, realized <span class="${t.realized >= 0 ? 'up' : 'down'}">${usd(t.realized, true)}</span></span>`
        if (t.kind === 'deposit') return `<span class="sub">Phoenix · Into your margin account</span>`
        if (t.kind === 'withdraw') return `<span class="sub">Phoenix · From your margin account</span>`
        if (t.kind === 'cancel') return `<span class="sub">Phoenix · Resting orders removed</span>`
        if (t.kind === 'activate') return `<span class="sub">Phoenix · Trader account opened</span>`
      }
      // Wallet money is signed; a perp order moves no wallet money, so it shows
      // its notional unsigned and quiet.
      function amount(r) {
        const t = r.trade
        if (!t) return `<span class="in">+${unit(r.in)}</span>`
        if (t.kind === 'swap')
          return `−${unit(`${t.pay.amount} ${t.pay.symbol}`)}<span class="got">${t.actual ? '+' : '≈ +'}${unit(`${t.get.amount} ${t.get.symbol}`)}</span>`
        if (t.kind === 'order' || t.kind === 'close')
          return `<span class="quiet">${group(r) === 'pending' ? '≈ ' : ''}${usd(t.notional)}</span><span class="note">notional</span>`
        if (t.kind === 'deposit') return `−${unit(`${t.amount} USDC`)}`
        if (t.kind === 'withdraw') return `<span class="in">+${unit(`${t.amount} USDC`)}</span>`
        return `<span class="quiet" style="color:var(--fg-3);font-weight:400">—</span>`
      }
      const source = (r) => (r.client ? `<b>${CLIENT[r.client]}</b> · ${DELIVERY[r.delivery]}` : '')
      const mark = (r) => (group(r) === 'confirmed' ? '' : `<span class="st st-${group(r)}">${group(r)[0].toUpperCase() + group(r).slice(1)}</span>`)

      function renderTx() {
        $('nav-tx').setAttribute('aria-current', 'page')
        $('net').textContent = 'Solana devnet'
        let day
        const perDay = rows.reduce((n, r) => ((n[r.day] = (n[r.day] ?? 0) + 1), n), {})
        const list = rows
          .map(
            (r, i) =>
              (r.day !== day ? `<h3 class="day"><b>${(day = r.day)}</b><span class="d-label" style="text-transform:none">${perDay[day]} transactions</span></h3>` : '') +
              `<button class="row cols ${gone(r) ? 'gone' : ''}" data-i="${i}">
                <span class="t">${r.t}</span>
                <span class="what"><b>${title(r)}${mark(r)}</b>${sub(r)}</span>
                <span class="src">${source(r)}</span>
                <span class="amt">${amount(r)}</span>
                <span class="sig">${sig(r.sig)}</span>
              </button>`,
          )
          .join('')
        $('main').innerHTML = `
          <h1>Transactions</h1>
          <div class="band">
            <div class="tabs"><button aria-pressed="true">All</button><button>Pending<i>1</i></button><button>Confirmed<i>8</i></button><button>Failed<i>1</i></button><button>Expired</button></div>
            <div class="tools">
              <select class="d-input" style="color:var(--fg-3)"><option>All kinds</option><option>Swaps</option><option>Perps</option><option>Transfers</option><option>Withdrawals</option><option>Deposits</option></select>
              <select class="d-input" style="color:var(--fg-3)"><option>All clients</option></select>
              <select class="d-input" style="color:var(--fg-3)"><option>Any signing</option></select>
              <input class="d-input mono" style="width:15rem;font-size:12.5px" placeholder="Search by address" />
            </div>
          </div>
          <div class="d-card">
            <div class="d-th cols thead"><span class="d-label">Time</span><span class="d-label">Transaction</span><span class="d-label">Source</span><span class="d-label" style="text-align:right">Amount</span><span class="d-label">Signature</span></div>
            ${list}
          </div>
          <p class="meta" style="text-align:center;padding-top:20px">That is every transaction.</p>`
        document.querySelectorAll('[data-i]').forEach((b) => (b.onclick = () => openTx(rows[+b.dataset.i])))
      }

      // ---------------------------------------------------------------------
      // Drawers
      function openDrawer(html) {
        $('drawer').innerHTML = html
        $('overlay').hidden = false
        $('drawer').querySelectorAll('[data-close]').forEach((b) => (b.onclick = close))
        $('drawer').querySelectorAll('[data-perps]').forEach(
          (b) => (b.onclick = (e) => (e.preventDefault(), close(), go('perps', b.dataset.perps))),
        )
      }
      const close = () => ($('overlay').hidden = true)
      $('scrim').onclick = close
      addEventListener('keydown', (e) => e.key === 'Escape' && close())

      const head = (r, t) =>
        `<div class="dh"><div><p>${r.client ? CLIENT[r.client] : 'Deposit'}, ${r.day.toLowerCase()} at ${r.t}</p><h2>${t}</h2></div><button class="d-btn d-btn-sm" data-close>Close</button></div>`
      const facts = (pairs) => `<dl class="facts">${pairs.filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`
      const signer = (r) => (r.account === WALLET ? 'Your LanaTools wallet' : r.account ? `<span class="mono" style="font-size:12.5px">${r.account}</span>` : null)
      const common = (r) => [
        ['Client', CLIENT[r.client]],
        ['Signing', { embedded: 'Embedded, no approval', link: 'Link, on the review page', local: "Local, the agent's own wallet" }[r.delivery]],
        signer(r) && ['Signed by', signer(r)],
        ['Network', 'Solana mainnet'],
        r.slot && ['Slot', `${r.slot}, finalized`],
        r.reason && ['Error', r.reason],
        r.expires && ['Expires', r.expires],
      ]
      const sigBlock = (r) =>
        r.sig
          ? `<p class="d-label section-l">Transaction</p><p class="d-well">${r.sig}</p>
             <div style="display:flex;gap:8px;margin-top:12px"><a class="d-btn d-btn-sm" href="#">View on Solana Explorer ↗</a><button class="d-btn d-btn-sm">Copy signature</button></div>`
          : ''
      const linkBlock = (r) =>
        r.reviewUrl
          ? `<p class="d-label section-l">Review link</p><p class="d-well">${r.reviewUrl}</p>
             <div style="display:flex;gap:8px;margin-top:12px"><a class="d-btn d-btn-sm" href="#">Open review page ↗</a><button class="d-btn d-btn-sm">Copy link</button></div>`
          : ''
      const statusLine = (r) =>
        `<p class="d-label">${group(r)}${r.status !== group(r) ? ` <span style="text-transform:none;opacity:.7">(${r.status})</span>` : ''}</p>`
      // The account a perp row belongs to: the wallet that signed it.
      const accountLink = (r, market) => {
        const who = r.account ?? WALLET
        const pos = POSITIONS.find((p) => p.market === market)
        return `<p class="d-label section-l">${market ? `${market} position now` : 'Phoenix account'}</p>
          <a class="poscard" href="#" data-perps="${who}">
            ${
              pos && market
                ? `<b><span class="side ${pos.side}">${pos.side === 'long' ? 'Long' : 'Short'}</span> ${pos.size} ${pos.base} · ${usd(pos.value)}</b><em>Open account →</em>
                   <span>Entry ${usd(pos.entry)} · Unrealized <span class="${pos.pnl >= 0 ? 'up' : 'down'}">${usd(pos.pnl, true)}</span></span>`
                : market
                  ? `<b>No open ${market} position</b><em>Open account →</em><span>The position was closed.</span>`
                  : `<b>${usd(ACCOUNT.value)} account value</b><em>Open account →</em><span>Collateral ${usd(ACCOUNT.collateral)} · ${POSITIONS.length} open positions</span>`
            }
          </a>
          ${who !== WALLET ? `<p class="meta" style="margin-top:6px">Signed by ${short(who)}, the agent's local wallet.</p>` : ''}`
      }

      function openTx(r) {
        const t = r.trade
        if (!t) return openDrawer(`${head(r, title(r))}${statusLine(r)}<p class="big">+25 <u>USDC</u></p>${facts([['From', `<span class="mono" style="font-size:12.5px">${r.from}</span>`], ['Kind', 'Deposit']])}${sigBlock(r)}`)
        if (t.kind === 'swap') return openSwap(r, t)
        if (t.kind === 'order' || t.kind === 'close') return openOrder(r, t)
        if (t.kind === 'deposit' || t.kind === 'withdraw') {
          const dep = t.kind === 'deposit'
          return openDrawer(`${head(r, title(r))}${statusLine(r)}
            <p class="big">${dep ? '−' : '+'}${t.amount} <u>USDC</u></p>
            <p class="under">${dep ? 'From your wallet into your Phoenix margin account.' : 'From your Phoenix margin account back to your wallet.'}</p>
            ${accountLink(r)}
            ${facts([['Protocol', 'Phoenix perpetuals'], ['Account', 'Cross margin'], ...common(r)])}${sigBlock(r)}`)
        }
        if (t.kind === 'cancel')
          return openDrawer(`${head(r, title(r))}${statusLine(r)}
            <p class="under" style="margin-top:8px">Removed ${t.count} resting orders on ${t.market}. Nothing filled.</p>

      const price = (v, p) => usd(+v.toFixed(p.dp)).replace(p.dp === 0 ? '.00' : '\u0000', '')
      const away = (p) => Math.abs((p.liq - p.mark) / p.mark * 100).toFixed(0)

      // Liquidation, entry and mark on one honest scale: how much room is left.
      function buffer(p) {
        const long = p.side === 'long'
        const ends = long ? [p.liq, Math.max(p.mark, p.entry) * 1.02] : [Math.min(p.mark, p.entry) * 0.98, p.liq]
        const at = (v) => ((v - ends[0]) / (ends[1] - ends[0])) * 100
        return `<div class="buf">
          <p class="d-label">Room to liquidation <b>${away(p)}%</b></p>
          <div class="buf-track">
            <span class="buf-room" style="left:${Math.min(at(p.mark), at(p.liq))}%;right:${100 - Math.max(at(p.mark), at(p.liq))}%"></span>
            <i class="buf-liq" style="left:${at(p.liq)}%"></i>
            <i class="buf-entry" style="left:${at(p.entry)}%" title="Entry"></i>
            <i class="buf-mark" style="left:${at(p.mark)}%" title="Mark"></i>
          </div>
          <div class="buf-ends"><span>${long ? `Liq ${price(p.liq, p)}` : `Mark ${price(p.mark, p)}`}</span><span>${long ? `Mark ${price(p.mark, p)}` : `Liq ${price(p.liq, p)}`}</span></div>
        </div>`
      }

              <tbody>${POSITIONS.map(
                (q) => `<tr data-pos="${q.market}" class="${q.market === focus ? 'on' : ''}">

              <tbody>${FILLS.map(
                (f) => `<tr><td style="color:var(--fg-3);font-weight:400">${f.t}</td><td class="mk"><b>${f.market}</b></td><td><span class="side ${f.side === 'buy' ? 'long' : 'short'}">${sideWord(f.side)}</span></td>
                  <td class="r">${f.size}</td><td class="r">${usd(f.price)}</td>

      // The chart is TradingView Lightweight Charts: Phoenix candles, with
      // entry, liquidation and resting orders as price lines. Drag to pan,
      // scroll or pinch to zoom, drag either axis to scale it.
      let chartApi
      let fitLiq = true
      function drawChart() {
        const box = $('chart')
        if (!box || !window.LightweightCharts) return
        const LW = window.LightweightCharts
        const css = getComputedStyle($('dash'))
        const v = (name) => css.getPropertyValue(name).trim()
        const p = POSITIONS.find((q) => q.market === focus)
        const order = ORDERS.find((o) => o.market === p.market)
        chartApi?.remove()
        const host = box.querySelector('.ll')
        chartApi = LW.createChart(host, {
          autoSize: true,
          layout: { background: { color: v('--panel') }, textColor: v('--fg-3'), fontFamily: "'Paper Mono', ui-monospace, monospace", fontSize: 11, attributionLogo: true },
          grid: { vertLines: { visible: false }, horzLines: { color: v('--line'), style: LW.LineStyle.Dotted } },
          rightPriceScale: { borderColor: v('--line'), scaleMargins: { top: 0.12, bottom: 0.1 } },
          timeScale: {
            borderColor: v('--line'), rightOffset: 4,
            // Local time, as the rest of the dashboard.
            tickMarkFormatter: (t, type) => new Date(t * 1000).toLocaleString('en-US', type >= 3 ? { hour: 'numeric', minute: '2-digit' } : { month: 'short', day: 'numeric' }),
          },
          crosshair: { mode: LW.CrosshairMode.Normal, vertLine: { color: v('--fg-3'), labelBackgroundColor: v('--fg') }, horzLine: { color: v('--fg-3'), labelBackgroundColor: v('--fg') } },
          localization: {
            priceFormatter: (x) => price(x, p),
            timeFormatter: (t) => new Date(t * 1000).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
          },
        })
        const series = chartApi.addSeries(LW.CandlestickSeries, {
          upColor: v('--up'), downColor: v('--bad'), wickUpColor: v('--up'), wickDownColor: v('--bad'), borderVisible: false,
          priceFormat: { type: 'price', precision: p.dp, minMove: p.dp ? 0.01 : 1 },
          lastValueVisible: true, priceLineColor: v('--accent'),
          // "Show liquidation" widens the fitted price range to reach it.
          autoscaleInfoProvider: (original) => {
            const r = original()
            if (!r || !fitLiq) return r
            return { ...r, priceRange: { minValue: Math.min(r.priceRange.minValue, p.liq, p.entry), maxValue: Math.max(r.priceRange.maxValue, p.liq, p.entry) } }
          },
        })
        const rows = CANDLES[p.market][range].map(([time, open, high, low, close]) => ({ time, open, high, low, close }))
        series.setData(rows)
        series.createPriceLine({ price: p.entry, color: v('--fg-2'), lineWidth: 1, lineStyle: LW.LineStyle.Dashed, axisLabelVisible: true, title: 'Entry' })
        series.createPriceLine({ price: p.liq, color: v('--bad'), lineWidth: 2, lineStyle: LW.LineStyle.Solid, axisLabelVisible: true, title: 'Liquidation' })
        if (order) series.createPriceLine({ price: order.price, color: v('--fg-3'), lineWidth: 1, lineStyle: LW.LineStyle.SparseDotted, axisLabelVisible: true, title: `${sideWord(order.side)} limit` })
        chartApi.timeScale().fitContent()

        // OHLC of the candle under the cursor, else the latest one.
        const legend = box.querySelector('.ohlc')
        const show = (c) => {
          if (!c) return
          const cls = c.close >= c.open ? 'up' : 'down'
          legend.innerHTML = ['O', 'H', 'L', 'C'].map((k, i) => `<span>${k} <b class="${cls}">${price([c.open, c.high, c.low, c.close][i], p)}</b></span>`).join('')
        }
        show(rows.at(-1))
        chartApi.subscribeCrosshairMove((param) => show(param.seriesData?.get(series) ?? rows.at(-1)))
      }

      function wirePerps() {
        document.querySelector('[data-back]').onclick = () => go('tx')
        const input = $('addr')
        input.onkeydown = (e) => e.key === 'Enter' && input.value.trim() && go('perps', input.value.trim())
        document.querySelectorAll('[data-mk],[data-pos]').forEach((b) => (b.onclick = () => ((focus = b.dataset.mk ?? b.dataset.pos), renderPerps())))
        document.querySelectorAll('[data-r]').forEach((b) => (b.onclick = () => ((range = b.dataset.r), renderPerps())))
        const fit = $('fit-liq')
        if (fit) fit.onclick = () => ((fitLiq = !fitLiq), renderPerps())
        const reset = $('reset')
        if (reset) reset.onclick = () => drawChart()
      }
      // ---------------------------------------------------------------------
      function go(view, address) {
        state.view = view
        if (view === 'perps') state.address = address ?? state.address ?? WALLET
        document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)))
        view === 'tx' ? renderTx() : renderPerps()
        scrollTo(0, 0)
      }
      document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => go(b.dataset.view)))
      $('m-empty').onclick = () => {
        state.empty = !state.empty
        $('m-empty').setAttribute('aria-pressed', String(state.empty))
        go('perps')
      }
      $('m-theme').onclick = () => {
        const dark = $('dash').dataset.theme !== 'dark'
        $('dash').dataset.theme = dark ? 'dark' : 'light'
        $('m-theme').setAttribute('aria-pressed', String(dark))
        if (state.view === 'perps' && !state.empty) drawChart()
      }
      go(location.hash === '#perps' ? 'perps' : 'tx')
    </script>
  </body>
</html>
