<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E · Shift</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Brand tokens. Light is paper and ink; dark is the deep brand navy. */
  :root {
    --bg: #f3efe6;
    --panel: #fffdf8;
    --panel-2: #ebe6da;
    --line: #d6d0c2;
    --line-2: #bfb7a4;
    --text: #0a1f6e;
    --text-2: #4a5480;
    --text-3: #7d84a6;
    --accent: #0b2fb2;
    --on-accent: #f3efe6;
    --tick: #0b2fb2;
    --live: #1d8f55;
    --live-glow: rgba(29, 143, 85, .18);
    --warn: #9a5b00;
    --bad: #b8361a;
    --flash: rgba(217, 255, 74, .45);
    --hatch-c: #ddd6c6;
    --hdr: #0b2fb2;
    --hdr-line: transparent;
    --hdr-track: rgba(5, 11, 43, .28);
    --hdr-dim: #b5c1f0;
    --pat: #d3c9b4;
    --pat-acc: rgba(11, 47, 178, .32);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #08090c; --panel: #0f1115; --panel-2: #171a21; --line: #23272f; --line-2: #343a46;
      --text: #f3efe6; --text-2: #aab1c5; --text-3: #6e7487; --accent: #f3efe6; --on-accent: #0a1f6e;
      --tick: #b5c1f0; --live: #d9ff4a; --live-glow: rgba(217, 255, 74, .25); --warn: #f2c25c; --bad: #ff8a70;
      --flash: rgba(217, 255, 74, .1); --hatch-c: #1b1e25;
      --hdr: #0f1115; --hdr-line: #23272f; --hdr-track: rgba(0, 0, 0, .3); --hdr-dim: #8d93a5;
      --pat: #262a32; --pat-acc: rgba(217, 255, 74, .3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #08090c; --panel: #0f1115; --panel-2: #171a21; --line: #23272f; --line-2: #343a46;
    --text: #f3efe6; --text-2: #aab1c5; --text-3: #6e7487; --accent: #f3efe6; --on-accent: #0a1f6e;
    --tick: #b5c1f0; --live: #d9ff4a; --live-glow: rgba(217, 255, 74, .25); --warn: #f2c25c; --bad: #ff8a70;
    --flash: rgba(217, 255, 74, .1); --hatch-c: #1b1e25;
    --hdr: #0f1115; --hdr-line: #23272f; --hdr-track: rgba(0, 0, 0, .3); --hdr-dim: #8d93a5;
      --pat: #262a32; --pat-acc: rgba(217, 255, 74, .3); color-scheme: dark;
  }
  :root { --hatch: repeating-linear-gradient(135deg, var(--hatch-c) 0 1px, transparent 1px 7px); --hdr-text: #f3efe6; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; padding-bottom: 38px; transition: background .2s, color .2s; }
  h1, h2, p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .label { font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }

  /* Header: the original layout. Brand-blue bar, aligned with the content column. */
  .site-header { position: relative; z-index: 2; background: var(--hdr); border-bottom: 1px solid var(--hdr-line); color: var(--hdr-text); }
  .bar { max-width: 1100px; margin: 0 auto; height: 60px; padding: 0 32px; display: flex; align-items: center; gap: 28px; }
  .logo { display: flex; align-items: center; gap: 9px; color: var(--hdr-text); text-decoration: none; font: 600 16px 'JetBrains Mono', monospace; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .theme { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--hdr-dim); border: 1.5px solid transparent; font-size: 15px; }
  .theme:hover { color: var(--hdr-text); border-color: rgba(181, 193, 240, .5); }
  .acct { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 4px; border-radius: 999px; border: 1.5px solid rgba(181, 193, 240, .5); font: 500 12.5px 'JetBrains Mono', monospace; color: var(--hdr-text); box-sizing: border-box; }
  .acct:hover { border-color: var(--hdr-text); }
  .acct .av { width: 24px; height: 24px; border-radius: 50%; background: #f3efe6; color: #0a1f6e; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .acct .chev { width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin: -3px 2px 0; }

  /* Tabs: the active tab sits on the bar's bottom edge */
  .site-header nav { display: flex; align-self: stretch; gap: 6px; }
  .site-header nav a { position: relative; display: flex; align-items: center; padding: 0 12px; color: var(--hdr-dim); text-decoration: none; font: 500 13px 'JetBrains Mono', monospace; transition: color .15s; }
  .site-header nav a:hover { color: var(--hdr-text); }
  .site-header nav a::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--hdr-text); transform: scaleX(0); transition: transform .2s; }
  .site-header nav a[aria-current] { color: var(--hdr-text); font-weight: 600; }
  .site-header nav a[aria-current]::after { transform: scaleX(1); }

  .frame { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 32px 40px; }

  .ident { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ident h1 { font: 600 18px 'JetBrains Mono', monospace; margin-right: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font: 500 12px 'JetBrains Mono', monospace; color: var(--text-2); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
  .btn { font: 600 13px 'JetBrains Mono', monospace; height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { border-color: var(--text-3); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary:hover { opacity: .9; }
  .btn.sm { height: 30px; padding: 0 11px; font-size: 12px; }
  .ident .acts { margin-left: auto; }

  /* 1. Wallet: balance, address and deposit together, inside a hatched frame */
  .hatch { margin-top: 20px; padding: 7px; background: var(--hatch); border: 1px dashed var(--line-2); border-radius: 14px; }
  .hero { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; display: grid; grid-template-columns: 1.15fr 1fr; overflow: hidden; }
  .hero > div { padding: 26px 28px; position: relative; }
  .hero > div + div { border-left: 1px solid var(--line); }
  .big { font: 600 58px/1 'JetBrains Mono', monospace; letter-spacing: -0.05em; margin: 16px 0 12px; }
  .big small { font-size: 14px; font-weight: 500; color: var(--text-3); letter-spacing: 0; margin-left: 10px; }
  .hero p { color: var(--text-2); max-width: 330px; }
  .water { position: absolute; right: 26px; bottom: 22px; color: var(--text); opacity: .06; }
  .addr { margin: 12px 0 16px; display: flex; gap: 8px; align-items: stretch; }
  .addr code { flex: 1; min-width: 0; font: 500 13px 'JetBrains Mono', monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; word-break: break-all; }
  .hint { font-size: 12.5px; color: var(--text-3); margin-top: 12px; }

  /* Section heads */
  section { margin-top: 36px; }
  .s-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .s-head h2 { font: 600 15px 'JetBrains Mono', monospace; }
  .count { font: 500 11px 'JetBrains Mono', monospace; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--text-2); }
  .s-head .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 13px; flex-wrap: wrap; }
  .search { height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 10px; width: 190px; font-size: 13px; }
  .search::placeholder { color: var(--text-3); }
  select.search { width: auto; cursor: pointer; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button { all: unset; cursor: pointer; padding: 3px 10px; border-radius: 6px; font: 500 12px 'JetBrains Mono', monospace; color: var(--text-3); }
  .seg button[aria-pressed=true] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }

  /* Tables */
  .table { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .tr { display: grid; align-items: center; gap: 16px; padding: 0 16px; min-height: 54px; }
  .tr + .tr { border-top: 1px solid var(--line); }
  .th { min-height: 36px; background: var(--hatch), var(--panel-2); }
  .th span { font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .th button { all: unset; cursor: pointer; font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .th button:hover, .th button[aria-sort] { color: var(--text); }
  .muted { color: var(--text-2); }
  .faint { color: var(--text-3); }

  /* 2. Clients: rows scale to any number of clients */
  .clients .tr { grid-template-columns: minmax(180px, 1.5fr) 120px minmax(160px, 1.7fr) 80px 110px 78px; }
  .clients .tr.row { cursor: pointer; }
  .clients .tr.row:hover { background: var(--bg); }
  .who { min-width: 0; }
  .who b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font: 11.5px 'JetBrains Mono', monospace; color: var(--text-3); }
  .status { display: inline-flex; align-items: center; gap: 7px; font: 500 12px 'JetBrains Mono', monospace; color: var(--text-2); white-space: nowrap; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex-shrink: 0; }
  .status.live { color: var(--text); }
  .status.live i { background: var(--live); box-shadow: 0 0 0 3px var(--live-glow); animation: pulse 2s ease-in-out infinite; }
  .status.near { color: var(--warn); } .status.near i { background: var(--warn); }
  .status.full { color: var(--bad); } .status.full i { background: var(--bad); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } }
  .ticks { display: flex; gap: 2px; }
  .ticks i { flex: 1; height: 12px; border-radius: 2px; background: var(--panel-2); }
  .ticks i.on { background: var(--tick); }
  .ticks.near i.on { background: var(--warn); }
  .ticks.full i.on { background: var(--bad); }
  .ticks + span { display: block; font: 11.5px 'JetBrains Mono', monospace; color: var(--text-3); margin-top: 4px; }
  .left { font: 600 14px 'JetBrains Mono', monospace; }
  .more { all: unset; box-sizing: border-box; display: block; width: 100%; text-align: center; padding: 11px; cursor: pointer; font: 500 12.5px 'JetBrains Mono', monospace; color: var(--text-2); border-top: 1px solid var(--line); background: var(--hatch); }
  .more:hover { color: var(--text); }
  .empty { padding: 26px 16px; color: var(--text-3); text-align: center; }

  /* 3. Activity */
  .act .tr { grid-template-columns: 88px minmax(0, 1.7fr) minmax(0, 1fr) 64px 170px; }
  .act .tr.day { min-height: 30px; background: var(--bg); font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); grid-template-columns: 1fr; }
  .tool { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool b { font-weight: 600; }
  .tool .mono { color: var(--text-3); font-size: 12px; margin-left: 6px; }
  .cl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
  .amt { text-align: right; font: 600 13px 'JetBrains Mono', monospace; }
  .o-free { color: var(--text-3); font-weight: 500; }
  .o-refused { color: var(--warn); }
  .o-failed { color: var(--bad); }
  .fresh { animation: flash 2.6s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }


  /* Side field: generic icons for agents, Solana transactions and data, scattered so nothing repeats */
  .side { position: fixed; top: 0; bottom: 0; pointer-events: none; z-index: 0; display: none; }
  .side.l { left: 0; -webkit-mask: linear-gradient(90deg, #000 40%, transparent); mask: linear-gradient(90deg, #000 40%, transparent); }
  .side.r { right: 0; -webkit-mask: linear-gradient(270deg, #000 40%, transparent); mask: linear-gradient(270deg, #000 40%, transparent); }
  .side .ln { fill: none; stroke: var(--pat); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .side .flow { fill: none; stroke: var(--pat); stroke-width: 1; stroke-dasharray: 1.5 4; stroke-linecap: round; }
  .side .fill { fill: var(--pat); opacity: .75; }
  .side .ic { fill: none; stroke: var(--pat); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .side .ic.acc { stroke: var(--pat-acc); }
  .side .ic .f { fill: var(--pat); stroke: none; }
  .side .ic.acc .f { fill: var(--pat-acc); }

  /* Status bar */
  footer { position: fixed; left: 0; right: 0; bottom: 0; height: 36px; background: var(--bg); border-top: 1px solid var(--line); display: flex; align-items: stretch; font: 500 12px 'JetBrains Mono', monospace; color: var(--text-2); z-index: 5; }
  footer > div { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-right: 1px solid var(--line); white-space: nowrap; }
  footer > div.sp { flex: 1; border: 0; }
  footer > div.r { border-right: 0; border-left: 1px solid var(--line); }
  footer i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }

  @media (max-width: 900px) {
    .bar { padding: 0 16px; gap: 10px; }
    .logo span, .acct .nm { display: none; }
    .acct { padding: 0 8px 0 4px; }
    .site-header nav a { padding: 0 8px; }
    .site-header nav a::after { left: 8px; right: 8px; }
    .theme { width: 30px; }
    .frame { padding: 20px 16px 48px; border: 0; }
    .hero { grid-template-columns: 1fr; }
    .hero > div + div { border-left: 0; border-top: 1px solid var(--line); }
    .big { font-size: 44px; }
    .ident .acts { margin-left: 0; }
    .s-head .right { margin-left: 0; width: 100%; }
    .search { flex: 1; width: auto; }
    .clients .tr { grid-template-columns: 1fr auto; row-gap: 8px; padding: 12px 14px; }
    .clients .tr.th { display: none; }
    .clients .tr > .c-bar { grid-column: 1 / -1; grid-row: 2; }
    .clients .tr > .c-status { grid-column: 1; grid-row: 3; }
    .clients .tr > .c-last, .clients .tr > .c-act { display: none; }
    .act .tr { grid-template-columns: 64px minmax(0, 1fr) auto; }
    .act .tr > .cl, .act .tr > .pr { display: none; }
    .act .tr.th > :nth-child(3), .act .tr.th > :nth-child(4) { display: none; }
    .tool .mono { display: block; margin: 0; }
    .why { display: none; }
    footer > div.hide-sm { display: none; }
  }
</style>
</head>
<body>
<svg class="side l" id="sideL" aria-hidden="true"></svg>
<svg class="side r" id="sideR" aria-hidden="true"></svg>
<header class="site-header" id="hdr">
  <div class="bar">
    <a class="logo" href="#"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M16 56h-4q-4 0-4-4V15q0-7 7-7h23l19 12.5V29L37 16H19.5q-3.5 0-3.5 3.5Z"/><path d="M23 26l8 7-8 7" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>lanatools.sh</span></a>
    <nav aria-label="Main"><a href="#" aria-current="page">Wallet</a><a href="#">Activity</a><a href="#">Settings</a></nav>
    <div class="tools">
      <button class="theme" id="theme" aria-label="Switch colour theme"></button>
      <button class="acct" aria-haspopup="menu" aria-label="Account, Pratik Saria"><span class="av">P</span><span class="nm">Pratik Saria</span><span class="chev"></span></button>
    </div>
  </div>
</header>

<div class="frame">
  <div class="ident">
    <h1>Wallet</h1>
    <span class="chip" id="net"></span>
    <div class="acts"><button class="btn">＋ Connect a client</button></div>
  </div>

  <div class="hatch">
    <div class="hero">
      <div>
        <div class="label">Available</div>
        <div class="big" id="bal"></div>
        <p>Your connected clients pay for tools from this balance, each within its own limit.</p>
        <div class="water" id="water"></div>
      </div>
      <div>
        <div class="label">Deposit USDC</div>
        <div class="addr"><code id="addr"></code><button class="btn">Copy</button></div>
        <button class="btn primary">↘ Deposit</button>
        <p class="hint">Send USDC on Solana devnet only. Other tokens or networks won’t show up.</p>
      </div>
    </div>
  </div>

  <section class="clients" aria-label="Connected clients">
    <div class="s-head">
      <h2>Connected clients</h2><span class="count" id="ccount"></span>
      <div class="right"><span id="spent"></span><input class="search" id="q" type="search" placeholder="Find a client…" aria-label="Find a client"></div>
    </div>
    <div class="table" id="clients"></div>
  </section>

  <section class="act" aria-label="Activity">
    <div class="s-head">
      <h2>Activity</h2>
      <div class="right"><div class="seg" id="seg"></div><select class="search" id="cf" aria-label="Filter by client"></select><a href="#" style="color:var(--text-2)">View all</a></div>
    </div>
    <div class="table" id="rows"></div>
  </section>
</div>

<footer>
  <div><i></i>Agent payments on</div>
  <div class="hide-sm" id="mcp"></div>
  <div class="sp"></div>
  <div class="r hide-sm" id="fnet"></div>
  <div class="r">Docs</div>
</footer>

<script>
  // Sample data: eight clients so the list shows how it scales.
  const now = Date.now(), min = 60e3, hr = 60 * min, day = 24 * hr
  const clients = [
    { id: 'cc', name: 'Claude Code (lanatools)', host: 'localhost:62434', limit: 2, spent: 0.06, last: now - 5 * hr },
    { id: 'cx', name: 'Codex', host: '127.0.0.1:58113', limit: 1, spent: 0.05, last: now - 54 * min, live: true },
    { id: 'cu', name: 'Cursor', host: 'localhost:51920', limit: 1, spent: 0.84, last: now - 2 * min, live: true },
    { id: 'cw', name: 'Claude Code (website)', host: 'localhost:61002', limit: 1, spent: 1, last: now - 70 * min },
    { id: 'rb', name: 'research-bot', host: '10.0.0.14:8811', limit: 3, spent: 0.31, last: now - 12 * min, live: true },
    { id: 'zd', name: 'Zed', host: 'localhost:49001', limit: 0.5, spent: 0.14, last: now - 3 * day },
    { id: 'ws', name: 'Windsurf', host: 'localhost:50333', limit: 5, spent: 0, last: null },
    { id: 'ci', name: 'Codex (CI runner)', host: '172.18.0.4:7001', limit: 0.25, spent: 0.02, last: now - 8 * day },
  ]
  const services = { merchant: 'Devnet merchant', helius: 'Helius RPC', search: 'Exa search' }
  const calls = [
    ['Today', '6:13 PM', 'cu', 'merchant', '/api/v1/fixed', 'x402', 'paid', 0.01],
    ['Today', '6:12 PM', 'cw', 'merchant', '/api/v1/fixed', 'x402', 'refused'],
    ['Today', '6:11 PM', 'cx', 'merchant', '/api/v1/premium', 'x402', 'refused'],
    ['Today', '6:08 PM', 'rb', 'search', '/search', 'MPP', 'paid', 0.05],
    ['Today', '6:08 PM', 'cx', 'merchant', '/api/v1/search', 'x402', 'paid', 0.02],
    ['Today', '6:05 PM', 'cx', 'merchant', '/api/v1/fixed', 'x402', 'paid', 0.01],
    ['Today', '6:02 PM', 'cx', 'helius', '/getAssetsByOwner', 'RPC', 'free'],
    ['Today', '5:58 PM', 'rb', 'helius', '/getSignaturesForAddress', 'RPC', 'free'],
    ['Today', '2:02 PM', 'cc', 'merchant', '/api/v1/fixed', 'x402', 'paid', 0.01],
    ['Today', '1:41 PM', 'cc', 'merchant', '/api/v1/fixed', 'MPP', 'failed'],
    ['Yesterday', '4:15 PM', 'zd', 'search', '/search', 'MPP', 'paid', 0.05],
    ['Yesterday', '4:14 PM', 'cc', 'merchant', '/api/v1/fixed', 'x402', 'paid', 0.01],
  ].map(([d, t, c, s, path, p, o, a]) => ({ d, t, c, s, path, p, o, a }))
  const wallet = { balance: 19.91, address: 'G7fu2vBDEZ9SYM4agJ9shffJQUmyg6UC' }

  const money = (n) => '$' + n.toFixed(2)
  const cap = (s) => s[0].toUpperCase() + s.slice(1)
  const byId = (id) => clients.find((c) => c.id === id)
  const ago = (t) => {
    if (t == null) return 'Not used yet'
    const m = Math.round((Date.now() - t) / min)
    return m < 1 ? 'Just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`
  }
  const state = (c) => c.spent >= c.limit ? 'full' : c.spent / c.limit >= 0.8 ? 'near' : c.live ? 'live' : 'idle'
  const stateLabel = { full: 'Limit reached', near: 'Near limit', live: 'Working now', idle: 'Idle' }
  const sol = (s) => `<svg viewBox="0 0 24 20" width="${s}" height="${(s * 20) / 24}" aria-hidden="true"><path fill="currentColor" d="M5 0h19l-5 5H0zM0 7.5h19l5 5H5zM5 15h19l-5 5H0z"/></svg>`

  document.getElementById('net').innerHTML = `${sol(12)} Solana devnet`
  document.getElementById('fnet').innerHTML = `${sol(12)} Solana devnet`
  document.getElementById('water').innerHTML = sol(64)
  document.getElementById('addr').textContent = wallet.address

  // Theme: follows the system until you pick one.
  const root = document.documentElement, themeBtn = document.getElementById('theme')
  const saved = (() => { try { return localStorage.getItem('lt-theme') } catch { return null } })()
  if (saved) root.dataset.theme = saved
  const current = () => root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  const paintBtn = () => {
    const dark = current() === 'dark'
    themeBtn.textContent = dark ? '☀' : '☾'
    themeBtn.title = dark ? 'Light mode' : 'Dark mode'
  }
  themeBtn.onclick = () => {
    root.dataset.theme = current() === 'dark' ? 'light' : 'dark'
    try { localStorage.setItem('lt-theme', root.dataset.theme) } catch {}
    paintBtn()
  }
  paintBtn()

  // Clients: sorted, searchable, folded after six rows
  let sort = 'last', showAll = false, q = ''
  const SHOW = 6
  const sorters = {
    last: (a, b) => (b.last ?? 0) - (a.last ?? 0),
    left: (a, b) => (a.limit - a.spent) - (b.limit - b.spent),
    name: (a, b) => a.name.localeCompare(b.name),
  }
  function renderClients() {
    const total = clients.reduce((s, c) => s + c.spent, 0)
    document.getElementById('ccount').textContent = clients.length
    document.getElementById('mcp').textContent = `MCP · ${clients.length} clients connected`
    document.getElementById('spent').innerHTML = `<span class="mono">${money(total)}</span> spent in total`
    const list = clients.filter((c) => (c.name + c.host).toLowerCase().includes(q)).sort(sorters[sort])
    const shown = showAll || q ? list : list.slice(0, SHOW)
    const head = (k, t) => `<button onclick="sort='${k}';renderClients()" ${sort === k ? 'aria-sort="ascending"' : ''}>${t}${sort === k ? ' ↓' : ''}</button>`
    document.getElementById('clients').innerHTML =
      `<div class="tr th">${head('name', 'Client')}<span>Status</span><span>Spent of limit</span>${head('left', 'Left')}${head('last', 'Last used')}<span></span></div>` +
      (shown.map((c) => {
        const st = state(c), n = 24, on = c.spent > 0 ? Math.max(1, Math.round((c.spent / c.limit) * n)) : 0
        return `<div class="tr row">
          <div class="who"><b title="${c.name}">${c.name}</b><span>${c.host}</span></div>
          <div class="c-status"><span class="status ${st}"><i></i>${stateLabel[st]}</span></div>
          <div class="c-bar"><div class="ticks ${st}">${Array.from({ length: n }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</div><span>${money(c.spent)} of ${money(c.limit)}</span></div>
          <div class="left">${money(Math.max(c.limit - c.spent, 0))}</div>
          <div class="c-last faint">${ago(c.last)}</div>
          <div class="c-act"><button class="btn sm">Manage</button></div>
        </div>`
      }).join('') || `<div class="empty">No client matches “${q}”.</div>`) +
      (!q && list.length > SHOW ? `<button class="more" onclick="showAll=!showAll;renderClients()">${showAll ? 'Show fewer' : `Show ${list.length - SHOW} more clients`}</button>` : '')
    document.getElementById('bal').innerHTML = `${money(wallet.balance)}<small>USDC</small>`
  }
  document.getElementById('q').oninput = (e) => { q = e.target.value.trim().toLowerCase(); renderClients() }

  // Activity: outcome filter plus a client filter that works for any number of clients
  let outcome = 'all', cf = ''
  document.getElementById('cf').innerHTML = `<option value="">All clients</option>` + clients.map((c) => `<option value="${c.id}">${c.name}</option>`).join('')
  document.getElementById('cf').onchange = (e) => { cf = e.target.value; renderRows() }
  function renderRows() {
    document.getElementById('seg').innerHTML = ['all', 'paid', 'free', 'refused', 'failed']
      .map((o) => `<button aria-pressed="${o === outcome}" onclick="outcome='${o}';renderRows()">${cap(o)}</button>`).join('')
    let d = null
    const xs = calls.filter((x) => (outcome === 'all' || x.o === outcome) && (!cf || x.c === cf)).slice(0, 10)
    document.getElementById('rows').innerHTML = `<div class="tr th"><span>Time</span><span>Tool</span><span>Client</span><span>Protocol</span><span style="text-align:right">Outcome</span></div>` +
      (xs.map((x) => {
        const head = x.d !== d ? `<div class="tr day">${(d = x.d)}</div>` : ''
        const out = x.o === 'paid' ? `−${money(x.a)}` : x.o === 'failed' ? 'Failed<span class="why"> · not charged</span>' : cap(x.o)
        return `${head}<div class="tr ${x.fresh ? 'fresh' : ''}">
          <span class="faint mono" style="font-size:12px">${x.t}</span>
          <span class="tool"><b>${services[x.s]}</b><span class="mono">${x.path}</span></span>
          <span class="cl">${byId(x.c).name}</span>
          <span class="pr faint mono" style="font-size:12px">${x.p}</span>
          <span class="amt o-${x.o}">${out}</span>
        </div>`
      }).join('') || `<div class="empty">No calls match these filters.</div>`)
    calls.forEach((x) => (x.fresh = false))
  }

  renderClients(); renderRows()

  // Mock only: let the tabs switch the active state.
  const hdr = document.getElementById('hdr')
  hdr.querySelectorAll('nav a').forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault()
    hdr.querySelectorAll('nav a').forEach((x) => x.removeAttribute('aria-current'))
    a.setAttribute('aria-current', 'page')
  }))



  // Side field: generic icons for agents, Solana transactions and reading data, scattered without a grid.
  const ICONS = {
    agent: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4.5"/><circle cx="12" cy="3.5" r="1"/><circle cx="9" cy="14" r=".9"/><circle cx="15" cy="14" r=".9"/>',
    spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/><path d="M19 17v4M17 19h4"/>',
    block: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
    link: '<path d="M10 14a4 4 0 0 1 0-5.6l2.4-2.4a4 4 0 0 1 5.6 5.6l-1.2 1.2"/><path d="M14 10a4 4 0 0 1 0 5.6l-2.4 2.4a4 4 0 0 1-5.6-5.6l1.2-1.2"/>',
    transfer: '<path d="M4 8h15l-3.5-3.5M20 16H5l3.5 3.5"/>',
    coin: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>',
    receipt: '<path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5Z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    database: '<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>',
    doc: '<path d="M7 3h7l4 4v14H7Z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
    chart: '<path d="M4 20h16M6 16l4-5 3 3 5-7"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5"/>',
    shield: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6Z"/><path d="M9 12l2 2 4-4"/>',
    wallet: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M6 7l10-3.5 1 3.5M16 13.5h2"/>',
    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    sign: '<path d="M15 4l5 5-10 10H5v-5Z"/><path d="M4 21h16"/>',
    fee: '<path d="M13 3L5 14h6l-1 7 8-11h-6Z"/>',
    api: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',
    nodes: '<circle cx="6" cy="6" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="10" cy="18" r="2"/><path d="M8 6.6l8 1.8M7 8l2.3 8M16.4 10.4l-4.8 6.2"/>',
    sol: 'SOL',
    usdc: '<g transform="scale(.012)"><path class="f" d="M1275 1158.33c0-145.83-87.5-195.83-262.5-216.66-125-16.67-150-50-150-108.34s41.67-95.83 125-95.83c75 0 116.67 25 137.5 87.5 4.17 12.5 16.67 20.83 29.17 20.83h66.66c16.67 0 29.17-12.5 29.17-29.16v-4.17c-16.67-91.67-91.67-162.5-187.5-170.83v-100c0-16.67-12.5-29.17-33.33-33.34h-62.5c-16.67 0-29.17 12.5-33.34 33.34v95.83c-125 16.67-204.16 100-204.16 204.17 0 137.5 83.33 191.66 258.33 212.5 116.67 20.83 154.17 45.83 154.17 112.5s-58.34 112.5-137.5 112.5c-108.34 0-145.84-45.84-158.34-108.34-4.16-16.66-16.66-25-29.16-25h-70.84c-16.66 0-29.16 12.5-29.16 29.17v4.17c16.66 104.16 83.33 179.16 220.83 200v100c0 16.66 12.5 29.16 33.33 33.33h62.5c16.67 0 29.17-12.5 33.34-33.33v-100c125-20.84 208.33-108.34 208.33-220.84z"/><path class="f" d="M787.5 1595.83c-325-116.66-491.67-479.16-370.83-800 62.5-175 200-308.33 370.83-370.83 16.67-8.33 25-20.83 25-41.67V325c0-16.67-8.33-29.17-25-33.33-4.17 0-12.5 0-16.67 4.16-395.83 125-612.5 545.84-487.5 941.67 75 233.33 254.17 412.5 487.5 487.5 16.67 8.33 33.34 0 37.5-16.67 4.17-4.16 4.17-8.33 4.17-16.66v-58.34c0-12.5-12.5-29.16-25-37.5zM1229.17 295.83c-16.67-8.33-33.34 0-37.5 16.67-4.17 4.17-4.17 8.33-4.17 16.67v58.33c0 16.67 12.5 33.33 25 41.67 325 116.66 491.67 479.16 370.83 800-62.5 175-200 308.33-370.83 370.83-16.67 8.33-25 20.83-25 41.67V1700c0 16.67 8.33 29.17 25 33.33 4.17 0 12.5 0 16.67-4.16 395.83-125 612.5-545.84 487.5-941.67-75-237.5-258.34-416.67-487.5-491.67z"/></g>',
  }
  const NAMES = [...Object.keys(ICONS), 'usdc', 'usdc']
  function drawSides() {
    const W = Math.floor((innerWidth - 1100) / 2), H = innerHeight
    const show = W >= 110
    for (const id of ['sideL', 'sideR']) document.getElementById(id).style.display = show ? 'block' : 'none'
    if (!show) return
    for (const [id, seed0] of [['sideL', 11], ['sideR', 29]]) {
      let seed = seed0
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296)
      const cell = 80, pts = []
      let last = ''
      // Jittered cells with random gaps, so there is no visible grid or repeat
      for (let y = 84; y < H - 56; y += cell) {
        for (let x = 10; x < W - 36; x += cell) {
          if (rnd() < 0.38) continue
          let name
          do { name = NAMES[Math.floor(rnd() * NAMES.length)] } while (name === last)
          last = name
          const size = name === 'usdc' ? 14 + rnd() * 4 : 20 + rnd() * 10
          pts.push({ x: x + rnd() * (cell - 36), y: y + rnd() * (cell - 36), s: size, name, acc: rnd() < 0.12 })
        }
      }
      let out = ''
      // A few dashed links between near neighbours, like a small network of calls
      pts.forEach((p, i) => {
        if (rnd() > 0.3) return
        let best = null, bd = 1e9
        pts.forEach((q, j) => { if (j === i) return; const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = q } })
        if (best && bd < 110) out += `<path class="flow" d="M${(p.x + p.s / 2).toFixed(1)} ${(p.y + p.s / 2).toFixed(1)}L${(best.x + best.s / 2).toFixed(1)} ${(best.y + best.s / 2).toFixed(1)}"/>`
      })
      for (const p of pts) {
        const k = p.s / 24
        out += p.name === 'sol'
          ? `<path class="fill" transform="translate(${(p.x + 1).toFixed(1)} ${(p.y + 3).toFixed(1)}) scale(${(k * 0.85).toFixed(3)})" d="M5 0h19l-5 5H0zM0 7.5h19l5 5H5zM5 15h19l-5 5H0z"/>`
          : `<g class="ic${p.acc ? ' acc' : ''}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(${k.toFixed(3)})">${ICONS[p.name]}</g>`
      }
      const svg = document.getElementById(id)
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H)
      svg.innerHTML = out
    }
  }
  drawSides()
  addEventListener('resize', drawSides)

  // Demo only: research-bot makes a paid call every 7 seconds.
  setInterval(() => {
    const c = byId('rb')
    if (c.limit - c.spent < 0.01) return
    const t = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
    calls.unshift({ d: 'Today', t, c: 'rb', s: 'search', path: '/contents', p: 'MPP', o: 'paid', a: 0.01, fresh: true })
    c.spent = Math.round((c.spent + 0.01) * 100) / 100
    c.last = Date.now()
    wallet.balance = Math.round((wallet.balance - 0.01) * 100) / 100
    renderClients(); renderRows()
  }, 7000)
</script>
